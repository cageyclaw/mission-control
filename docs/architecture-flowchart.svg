<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <!-- LCARS Colors -->
    <linearGradient id="lcarsOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#FFCC00"/>
    </linearGradient>
    <linearGradient id="lcarsBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00CCFF"/>
      <stop offset="100%" style="stop-color:#0099CC"/>
    </linearGradient>
    <linearGradient id="lcarsPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CC99FF"/>
      <stop offset="100%" style="stop-color:#9966CC"/>
    </linearGradient>
    <linearGradient id="lcarsPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF99CC"/>
      <stop offset="100%" style="stop-color:#CC6699"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#1a1a2e"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="900" height="50" fill="url(#lcarsOrange)"/>
  <text x="450" y="33" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000" text-anchor="middle">OCC BACKEND ARCHITECTURE</text>
  <text x="870" y="33" font-family="Arial, sans-serif" font-size="14" fill="#000" text-anchor="end">REV 8.0</text>

  <!-- Left LCARS Bar -->
  <rect x="20" y="70" width="30" height="600" rx="5" fill="url(#lcarsOrange)"/>
  <rect x="20" y="400" width="30" height="270" rx="5" fill="url(#lcarsBlue)"/>

  <!-- Browser / Electron Client -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="280" height="140" rx="10" fill="#2a2a4a" stroke="url(#lcarsPurple)" stroke-width="3"/>
    <text x="140" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#CC99FF" text-anchor="middle">OCC ELECTRON CLIENT</text>

    <!-- Client Components -->
    <rect x="15" y="50" width="120" height="70" rx="5" fill="#1a1a3a" stroke="#FF99CC" stroke-width="1"/>
    <text x="75" y="70" font-family="Arial, sans-serif" font-size="11" fill="#FF99CC" text-anchor="middle">React UI</text>
    <text x="75" y="88" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">LCARS Components</text>
    <text x="75" y="105" font-family="Arial, sans-serif" font-size="9" fill="#888" text-anchor="middle">Views + Panels</text>

    <rect x="145" y="50" width="120" height="70" rx="5" fill="#1a1a3a" stroke="#00CCFF" stroke-width="1"/>
    <text x="205" y="70" font-family="Arial, sans-serif" font-size="11" fill="#00CCFF" text-anchor="middle">Zustand Stores</text>
    <text x="205" y="88" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">sessions, chat, tool</text>
    <text x="205" y="105" font-family="Arial, sans-serif" font-size="9" fill="#888" text-anchor="middle">system, feed, metrics</text>
  </g>

  <!-- Native Gateway Client -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="280" height="120" rx="10" fill="#2a2a4a" stroke="#FF9900" stroke-width="3"/>
    <text x="140" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FF9900" text-anchor="middle">NATIVE GATEWAY CLIENT</text>

    <text x="140" y="50" font-family="Arial, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">WebSocket Connection</text>
    <text x="140" y="68" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">Ed25519 Device Auth</text>
    <text x="140" y="86" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">Event Dispatch (RPC + Events)</text>
    <text x="140" y="104" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">Auto-reconnect + Backoff</text>
  </g>

  <!-- Connection Arrow -->
  <g transform="translate(400, 310)">
    <path d="M0,0 L80,0" stroke="#00CCFF" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="40" y="-10" font-family="Arial, sans-serif" font-size="10" fill="#00CCFF" text-anchor="middle">WebSocket</text>
  </g>

  <!-- OpenClaw Gateway -->
  <g transform="translate(500, 90)">
    <rect x="0" y="0" width="320" height="280" rx="10" fill="#2a2a4a" stroke="url(#lcarsBlue)" stroke-width="3"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00CCFF" text-anchor="middle">OPENCLAW GATEWAY</text>
    <text x="160" y="50" font-family="Arial, sans-serif" font-size="11" fill="#888" text-anchor="middle">Port 18789</text>

    <!-- Gateway Components -->
    <rect x="20" y="70" width="130" height="90" rx="5" fill="#1a1a3a" stroke="#FF9900" stroke-width="1"/>
    <text x="85" y="90" font-family="Arial, sans-serif" font-size="11" fill="#FF9900" text-anchor="middle">Session Manager</text>
    <text x="85" y="108" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">sessions.list</text>
    <text x="85" y="123" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">sessions.subscribe</text>
    <text x="85" y="138" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">sessions.changed</text>

    <rect x="170" y="70" width="130" height="90" rx="5" fill="#1a1a3a" stroke="#FF99CC" stroke-width="1"/>
    <text x="235" y="90" font-family="Arial, sans-serif" font-size="11" fill="#FF99CC" text-anchor="middle">Chat Engine</text>
    <text x="235" y="108" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">chat.history</text>
    <text x="235" y="123" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">chat.send</text>
    <text x="235" y="138" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">chat (delta/final)</text>

    <rect x="20" y="175" width="130" height="85" rx="5" fill="#1a1a3a" stroke="#CC99FF" stroke-width="1"/>
    <text x="85" y="195" font-family="Arial, sans-serif" font-size="11" fill="#CC99FF" text-anchor="middle">Agent Runtime</text>
    <text x="85" y="213" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">agent (tool stream)</text>
    <text x="85" y="228" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Tool execution</text>
    <text x="85" y="243" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Subagent spawning</text>

    <rect x="170" y="175" width="130" height="85" rx="5" fill="#1a1a3a" stroke="#00CCFF" stroke-width="1"/>
    <text x="235" y="195" font-family="Arial, sans-serif" font-size="11" fill="#00CCFF" text-anchor="middle">Health & System</text>
    <text x="235" y="213" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">health RPC</text>
    <text x="235" y="228" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">hello/ready events</text>
    <text x="235" y="243" font-family="Arial, sans-serif" size="9" fill="#aaa" text-anchor="middle">System metrics</text>
  </g>

  <!-- Host Metrics Sidecar -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="280" height="100" rx="10" fill="#2a2a4a" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="140" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">HOST METRICS SIDECAR</text>
    <text x="140" y="45" font-family="Arial, sans-serif" size="10" fill="#666" text-anchor="middle">Optional / Separate Process</text>
    <text x="140" y="65" font-family="Arial, sans-serif" size="10" fill="#666" text-anchor="middle">CPU / Memory / Disk / Uptime</text>
    <text x="140" y="82" font-family="Arial, sans-serif" size="9" fill="#555" text-anchor="middle">HTTP Polling (5s interval)</text>
  </g>

  <!-- Metrics Arrow -->
  <g transform="translate(400, 470)">
    <path d="M0,0 L80,0" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="40" y="-8" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">HTTP</text>
  </g>

  <!-- Legend -->
  <g transform="translate(500, 420)">
    <rect x="0" y="0" width="320" height="100" rx="5" fill="#1a1a3a" stroke="#444" stroke-width="1"/>
    <text x="160" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ccc" text-anchor="middle">LEGEND</text>

    <rect x="15" y="35" width="15" height="15" fill="#FF9900"/>
    <text x="35" y="47" font-family="Arial, sans-serif" font-size="10" fill="#ccc">Gateway-Native State (Events)</text>

    <rect x="15" y="55" width="15" height="15" fill="#00CCFF"/>
    <text x="35" y="67" font-family="Arial, sans-serif" font-size="10" fill="#ccc">WebSocket / RPC</text>

    <rect x="180" y="35" width="15" height="15" fill="#CC99FF"/>
    <text x="200" y="47" font-family="Arial, sans-serif" font-size="10" fill="#ccc">UI / React Components</text>

    <rect x="180" y="55" width="15" height="15" fill="#888"/>
    <text x="200" y="67" font-family="Arial, sans-serif" font-size="10" fill="#ccc">Optional / Host Metrics</text>
  </g>

  <!-- Store Labels -->
  <g transform="translate(80, 550)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF9900">STORE ARCHITECTURE:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" fill="#aaa">• sessionsStore.ts — Gateway events (sessions.subscribe)</text>
    <text x="0" y="38" font-family="Arial, sans-serif" font-size="10" fill="#aaa">• chatStore.ts — Gateway events (chat.send, chat stream)</text>
    <text x="0" y="56" font-family="Arial, sans-serif" font-size="10" fill="#aaa">• toolStore.ts — Gateway events (agent tool stream)</text>
    <text x="0" y="74" font-family="Arial, sans-serif" font-size="10" fill="#aaa">• activityFeedStore.ts — Computed projection (no persistence)</text>
    <text x="0" y="92" font-family="Arial, sans-serif" font-size="10" fill="#00CCFF">• systemStore.ts — Gateway health (RPC + events)</text>
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="10" fill="#888">• hostMetricsStore.ts — Host sidecar (HTTP polling)</text>
  </g>

  <!-- Bottom LCARS Bar -->
  <rect x="60" y="675" width="840" height="20" rx="5" fill="url(#lcarsOrange)"/>
  <rect x="700" y="675" width="200" height="20" rx="5" fill="url(#lcarsBlue)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00CCFF"/>
    </marker>
  </defs>
</svg>