<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0a0a0f"/>
  
  <!-- Grid lines -->
  <g opacity="0.1">
    <line x1="0" y1="200" x2="1920" y2="200" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1920" y2="400" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="600" x2="1920" y2="600" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#00aaff" stroke-width="1"/>
    <line x1="480" y1="120" x2="480" y2="1080" stroke="#cc88ff" stroke-width="1"/>
    <line x1="960" y1="120" x2="960" y2="1080" stroke="#cc88ff" stroke-width="1"/>
    <line x1="1440" y1="120" x2="1440" y2="1080" stroke="#cc88ff" stroke-width="1"/>
  </g>

  <!-- HEADER -->
  <!-- Reference badge - Purple -->
  <rect x="40" y="20" width="160" height="80" rx="40" ry="40" fill="#cc88ff"/>
  <text x="120" y="72" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0a0a0f" text-anchor="middle">47-01</text>
  
  <!-- Title bar - Orange -->
  <rect x="220" y="20" width="1300" height="40" rx="20" ry="20" fill="#ff9900"/>
  <text x="240" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0a0a0f">OCC SYSTEM ARCHITECTURE</text>
  
  <!-- Subtitle bar - Cyan -->
  <rect x="220" y="70" width="1100" height="30" rx="15" ry="15" fill="#00aaff"/>
  <text x="240" y="92" font-family="Arial, sans-serif" font-size="16" fill="#0a0a0f">Initialization &amp; Gateway Event Flow</text>
  
  <!-- Right accent -->
  <rect x="1540" y="20" width="340" height="80" rx="15" ry="15" fill="#0a0a0f" stroke="#ff9900" stroke-width="2"/>
  <rect x="1550" y="30" width="60" height="60" rx="10" ry="10" fill="#ff9900"/>
  <rect x="1620" y="30" width="60" height="60" rx="10" ry="10" fill="#00aaff"/>
  <rect x="1690" y="30" width="60" height="60" rx="10" ry="10" fill="#cc88ff"/>
  <rect x="1760" y="30" width="40" height="60" rx="8" ry="8" fill="#ff4444"/>
  <rect x="1810" y="30" width="60" height="60" rx="10" ry="10" fill="#ffcc00"/>

  <!-- SECTION 1: Gateway Client -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="420" height="900" rx="20" ry="20" fill="#0a0a0f" stroke="#ff9900" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Header pill -->
    <rect x="20" y="20" width="200" height="35" rx="17" ry="17" fill="#ff9900"/>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0a0a0f">GATEWAY CLIENT</text>
    
    <!-- Components -->
    <rect x="40" y="80" width="160" height="50" rx="10" ry="10" fill="#1a1a2a" stroke="#00aaff" stroke-width="2"/>
    <text x="120" y="111" font-family="monospace" font-size="14" fill="#00aaff" text-anchor="middle">WebSocket</text>
    
    <rect x="220" y="80" width="160" height="50" rx="10" ry="10" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    <text x="300" y="111" font-family="monospace" font-size="14" fill="#cc88ff" text-anchor="middle">Auth</text>
    
    <rect x="130" y="160" width="160" height="50" rx="10" ry="10" fill="#1a1a2a" stroke="#ffcc00" stroke-width="2"/>
    <text x="210" y="191" font-family="monospace" font-size="14" fill="#ffcc00" text-anchor="middle">RPC</text>
    
    <!-- Connection lines -->
    <line x1="120" y1="130" x2="120" y2="150" stroke="#00aaff" stroke-width="2"/>
    <line x1="120" y1="150" x2="210" y2="150" stroke="#00aaff" stroke-width="2"/>
    <line x1="300" y1="130" x2="300" y2="150" stroke="#cc88ff" stroke-width="2"/>
    <line x1="300" y1="150" x2="210" y2="150" stroke="#cc88ff" stroke-width="2"/>
    <line x1="210" y1="210" x2="210" y2="240" stroke="#ffcc00" stroke-width="2"/>
    
    <!-- Connection state -->
    <rect x="60" y="250" width="300" height="150" rx="15" ry="15" fill="#1a1a2a" stroke="#ff9900" stroke-width="2"/>
    <text x="210" y="285" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">CONNECTION STATE</text>
    
    <circle cx="120" cy="330" r="12" fill="#00ff00"/>
    <text x="160" y="336" font-family="monospace" font-size="14" fill="#ffffff">connected</text>
    
    <!-- Reconnection logic -->
    <rect x="60" y="430" width="300" height="200" rx="15" ry="15" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    <text x="210" y="465" font-family="monospace" font-size="16" fill="#cc88ff" text-anchor="middle" font-weight="bold">RECONNECTION LOGIC</text>
    
    <text x="80" y="510" font-family="monospace" font-size="13" fill="#888899">attempt = 0</text>
    <text x="80" y="535" font-family="monospace" font-size="13" fill="#888899">baseDelay = 1000ms</text>
    <text x="80" y="560" font-family="monospace" font-size="13" fill="#888899">maxDelay = 30000ms</text>
    <text x="80" y="590" font-family="monospace" font-size="13" fill="#ff9900">delay = baseDelay * 2^attempt</text>
    
    <!-- Arrow down -->
    <polygon points="210,640 200,660 220,660" fill="#ff9900"/>
    <line x1="210" y1="660" x2="210" y2="700" stroke="#ff9900" stroke-width="3"/>
  </g>

  <!-- SECTION 2: Store Initialization -->
  <g transform="translate(490, 140)">
    <rect x="0" y="0" width="420" height="900" rx="20" ry="20" fill="#0a0a0f" stroke="#00aaff" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Header pill -->
    <rect x="20" y="20" width="240" height="35" rx="17" ry="17" fill="#00aaff"/>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0a0a0f">STORE INITIALIZATION</text>
    
    <!-- Init sequence -->
    <rect x="40" y="80" width="200" height="50" rx="10" ry="10" fill="#1a1a2a" stroke="#ff9900" stroke-width="2"/>
    <text x="90" y="105" font-family="monospace" font-size="13" fill="#ff9900">1.</text>
    <text x="130" y="111" font-family="monospace" font-size="14" fill="#ffffff">Sessions Store</text>
    
    <rect x="40" y="160" width="200" height="50" rx="10" ry="10" fill="#1a1a2a" stroke="#00aaff" stroke-width="2"/>
    <text x="90" y="185" font-family="monospace" font-size="13" fill="#00aaff">2.</text>
    <text x="130" y="191" font-family="monospace" font-size="14" fill="#ffffff">Chat Store</text>
    
    <rect x="40" y="240" width="200" height="50" rx="10" ry="10" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    <text x="90" y="265" font-family="monospace" font-size="13" fill="#cc88ff">3.</text>
    <text x="130" y="271" font-family="monospace" font-size="14" fill="#ffffff">Tool Store</text>
    
    <!-- Sequencing arrows -->
    <line x1="140" y1="130" x2="140" y2="160" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="140" y1="210" x2="140" y2="240" stroke="#00aaff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="140" y1="290" x2="140" y2="320" stroke="#cc88ff" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- SECTION 3: Activity Feed Store -->
  <g transform="translate(960, 160)">
    <rect x="0" y="0" width="900" height="880" rx="20" ry="20" fill="#0a0a0f" stroke="#cc88ff" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Header pill -->
    <rect x="20" y="20" width="240" height="35" rx="17" ry="17" fill="#cc88ff"/>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0a0a0f">ACTIVITY FEED STORE</text>
    
    <!-- Description -->
    <rect x="30" y="70" width="840" height="100" rx="12" ry="12" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    <text x="450" y="100" font-family="monospace" font-size="14" fill="#cc88ff" text-anchor="middle" font-weight="bold">Pure Read-Only Projection</text>
    <text x="450" y="130" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">Derives feed entries from session/chat/tool state</text>
    <text x="450" y="155" font-family="monospace" font-size="11" fill="#888899" text-anchor="middle">No synthetic events — computed views only</text>
  </g>
</svg>