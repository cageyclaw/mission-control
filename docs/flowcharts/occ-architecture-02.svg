<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0f"/>
  
  <!-- Grid lines -->
  <g opacity="0.08">
    <line x1="0" y1="240" x2="1920" y2="240" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="460" x2="1920" y2="460" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="680" x2="1920" y2="680" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="900" x2="1920" y2="900" stroke="#00aaff" stroke-width="1"/>
    <line x1="480" y1="120" x2="480" y2="1080" stroke="#cc88ff" stroke-width="1"/>
    <line x1="960" y1="120" x2="960" y2="1080" stroke="#cc88ff" stroke-width="1"/>
    <line x1="1440" y1="120" x2="1440" y2="1080" stroke="#cc88ff" stroke-width="1"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="140" height="70" rx="35" ry="35" fill="#cc88ff"/>
    <text x="70" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0a0a0f" text-anchor="middle">47-02</text>
    
    <rect x="160" y="5" width="1200" height="35" rx="17" ry="17" fill="#ff9900"/>
    <text x="180" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0a0a0f">CHAT MESSAGE LIFECYCLE</text>
    
    <rect x="160" y="45" width="1000" height="25" rx="12" ry="12" fill="#00aaff"/>
    <text x="180" y="63" font-family="Arial, sans-serif" font-size="14" fill="#0a0a0f">Send → Stream → Complete Flow</text>
    
    <rect x="1380" y="5" width="80" height="65" rx="10" ry="10" fill="#ff9900"/>
    <rect x="1470" y="5" width="60" height="65" rx="10" ry="10" fill="#00aaff"/>
    <rect x="1540" y="5" width="60" height="65" rx="10" ry="10" fill="#cc88ff"/>
    <rect x="1610" y="5" width="40" height="65" rx="8" ry="8" fill="#ff4444"/>
    <rect x="1660" y="5" width="180" height="65" rx="10" ry="10" fill="#0a0a0f" stroke="#ffcc00" stroke-width="2"/>
  </g>

  <!-- FLOW SECTION -->
  <g transform="translate(40, 130)">
    <!-- USER MESSAGE SEND -->
    <rect x="0" y="0" width="400" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#00aaff" stroke-width="4" filter="url(#shadow)"/>
    <rect x="20" y="20" width="200" height="32" rx="16" ry="16" fill="#00aaff"/>
    <text x="120" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">USER SEND</text>
    
    <!-- Send message box -->
    <rect x="30" y="70" width="340" height="180" rx="12" ry="12" fill="#1a1a2a" stroke="#00aaff" stroke-width="2"/>
    <text x="200" y="100" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">sendMessage(text)</text>
    
    <text x="50" y="130" font-family="monospace" font-size="12" fill="#888899">1. Validate input</text>
    <text x="50" y="155" font-family="monospace" font-size="12" fill="#888899">2. Check session</text>
    <text x="50" y="180" font-family="monospace" font-size="12" fill="#ff9900">3. Optimistic UI update</text>
    <text x="50" y="205" font-family="monospace" font-size="12" fill="#00aaff">4. chat.send RPC</text>
    
    <!-- Arrow down -->
    <polygon points="200,260 190,280 210,280" fill="#00aaff"/>
    
    <!-- Gateway Processing -->
    <rect x="30" y="300" width="340" height="120" rx="12" ry="12" fill="#1a1a2a" stroke="#ff9900" stroke-width="2"/>
    <text x="200" y="330" font-family="monospace" font-size="14" fill="#ff9900" text-anchor="middle" font-weight="bold">GATEWAY PROCESSING</text>
    <text x="200" y="360" font-family="monospace" font-size="12" fill="#888899" text-anchor="middle">Assistant run initiated</text>
    <text x="200" y="390" font-family="monospace" font-size="12" fill="#888899" text-anchor="middle">Stream events begin</text>
    
    <!-- Arrow down -->
    <polygon points="200,430 190,450 210,450" fill="#ff9900"/>
    
    <!-- History Reconciliation -->
    <rect x="30" y="470" width="340" height="100" rx="12" ry="12" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    <text x="200" y="505" font-family="monospace" font-size="14" fill="#cc88ff" text-anchor="middle" font-weight="bold">HISTORY RECONCILIATION</text>
    <text x="200" y="535" font-family="monospace" font-size="11" fill="#888899" text-anchor="middle">chatHistory() → merge</text>
    
    <!-- Arrow to center -->
    <line x1="400" y1="520" x2="450" y2="520" stroke="#cc88ff" stroke-width="3"/>
  </g>

  <!-- STREAM EVENTS -->
  <g transform="translate(470, 130)">
    <rect x="0" y="0" width="400" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#ffcc00" stroke-width="4" filter="url(#shadow)"/>
    <rect x="20" y="20" width="200" height="32" rx="16" ry="16" fill="#ffcc00"/>
    <text x="120" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">STREAM EVENTS</text>
    
    <!-- Delta -->
    <rect x="30" y="70" width="340" height="140" rx="12" ry="12" fill="#1a1a2a" stroke="#00aaff" stroke-width="2"/>
    <text x="200" y="100" font-family="monospace" font-size="14" fill="#00aaff" text-anchor="middle" font-weight="bold">state = 'delta'</text>
    <text x="200" y="130" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">Text accumulated</text>
    <text x="200" y="160" font-family="monospace" font-size="12" fill="#888899" text-anchor="middle">Stream updated</text>
    
    <!-- Final -->
    <rect x="30" y="240" width="340" height="140" rx="12" ry="12" fill="#1a1a2a" stroke="#00ff00" stroke-width="2"/>
    <text x="200" y="270" font-family="monospace" font-size="14" fill="#00ff00" text-anchor="middle" font-weight="bold">state = 'final'</text>
    <text x="200" y="300" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">Assistant message created</text>
    <text x="200" y="330" font-family="monospace" font-size="12" fill="#888899" text-anchor="middle">status = 'complete'</text>
    
    <!-- Aborted -->
    <rect x="30" y="410" width="340" height="140" rx="12" ry="12" fill="#1a1a2a" stroke="#ffcc00" stroke-width="2"/>
    <text x="200" y="440" font-family="monospace" font-size="14" fill="#ffcc00" text-anchor="middle" font-weight="bold">state = 'aborted'</text>
    <text x="200" y="470" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">Partial text preserved</text>
    <text x="200" y="500" font-family="monospace" font-size="12" fill="#888899" text-anchor="middle">status = 'interrupted'</text>
    
    <!-- Error -->
    <rect x="30" y="580" width="340" height="140" rx="12" ry="12" fill="#1a1a2a" stroke="#ff4444" stroke-width="2"/>
    <text x="200" y="610" font-family="monospace" font-size="14" fill="#ff4444" text-anchor="middle" font-weight="bold">state = 'error'</text>
    <text x="200" y="640" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">Error message extracted</text>
    <text x="200" y="670" font-family="monospace" font-size="12" fill="#888899" text-anchor="middle">status = 'error'</text>
    
    <!-- Arrows -->
    <line x1="200" y1="210" x2="200" y2="240" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="200" y1="380" x2="200" y2="410" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="200" y1="550" x2="200" y2="580" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- UI UPDATE -->
  <g transform="translate(900, 130)">
    <rect x="0" y="0" width="400" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#cc88ff" stroke-width="4" filter="url(#shadow)"/>
    <rect x="20" y="20" width="150" height="32" rx="16" ry="16" fill="#cc88ff"/>
    <text x="95" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">UI UPDATE</text>
    
    <rect x="30" y="70" width="340" height="400" rx="12" ry="12" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    <text x="200" y="100" font-family="monospace" font-size="14" fill="#cc88ff" text-anchor="middle" font-weight="bold">TRANSCRIPT UPDATE</text>
    
    <text x="50" y="140" font-family="monospace" font-size="12" fill="#ffffff">• Transcript store updated</text>
    <text x="50" y="170" font-family="monospace" font-size="12" fill="#ffffff">• Messages derived</text>
    <text x="50" y="200" font-family="monospace" font-size="12" fill="#ffffff">  (transcript + stream)</text>
    <text x="50" y="230" font-family="monospace" font-size="12" fill="#ffffff">• Components re-render</text>
    
    <!-- ChatMessageBubble -->
    <rect x="50" y="270" width="300" height="80" rx="8" ry="8" fill="#0a0a0f" stroke="#00aaff" stroke-width="1"/>
    <text x="200" y="295" font-family="monospace" font-size="12" fill="#00aaff" text-anchor="middle">ChatMessageBubble</text>
    <text x="200" y="320" font-family="monospace" font-size="11" fill="#888899" text-anchor="middle">role | text | status</text>
    
    <rect x="50" y="370" width="300" height="80" rx="8" ry="8" fill="#0a0a0f" stroke="#00aaff" stroke-width="1"/>
    <text x="200" y="395" font-family="monospace" font-size="12" fill="#00aaff" text-anchor="middle">ChatTranscript</text>
    <text x="200" y="420" font-family="monospace" font-size="11" fill="#888899" text-anchor="middle">messages[] + scroll</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(1340, 130)">
    <rect x="0" y="0" width="520" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#ff9900" stroke-width="4" filter="url(#shadow)"/>
    <rect x="20" y="20" width="120" height="32" rx="16" ry="16" fill="#ff9900"/>
    <text x="80" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">LEGEND</text>
    
    <text x="30" y="80" font-family="monospace" font-size="13" fill="#ffffff">Status Colors:</text>
    
    <rect x="30" y="100" width="20" height="20" rx="4" fill="#00aaff"/>
    <text x="60" y="115" font-family="monospace" font-size="12" fill="#888899">streaming / delta</text>
    
    <rect x="30" y="135" width="20" height="20" rx="4" fill="#00ff00"/>
    <text x="60" y="150" font-family="monospace" font-size="12" fill="#888899">complete / final</text>
    
    <rect x="30" y="170" width="20" height="20" rx="4" fill="#ffcc00"/>
    <text x="60" y="185" font-family="monospace" font-size="12" fill="#888899">interrupted / aborted</text>
    
    <rect x="30" y="205" width="20" height="20" rx="4" fill="#ff4444"/>
    <text x="60" y="220" font-family="monospace" font-size="12" fill="#888899">error</text>
    
    <text x="30" y="270" font-family="monospace" font-size="13" fill="#ffffff">Key Concepts:</text>
    
    <text x="30" y="300" font-family="monospace" font-size="11" fill="#888899">• Optimistic UI: Show before confirm</text>
    <text x="30" y="325" font-family="monospace" font-size="11" fill="#888899">• Stream: Temporary assistant state</text>
    <text x="30" y="350" font-family="monospace" size="11" fill="#888899">• Idempotency: Prevent duplicates</text>
    <text x="30" y="375" font-family="monospace" font-size="11" fill="#888899">• Reconciliation: Sync with server</text>
    
    <!-- LCARS decorative bars -->
    <rect x="30" y="820" width="100" height="60" rx="8" fill="#ff9900"/>
    <rect x="140" y="820" width="80" height="60" rx="8" fill="#00aaff"/>
    <rect x="230" y="820" width="80" height="60" rx="8" fill="#cc88ff"/>
    <rect x="320" y="820" width="60" height="60" rx="8" fill="#ff4444"/>
    <rect x="390" y="820" width="100" height="60" rx="8" fill="#0a0a0f" stroke="#ffcc00" stroke-width="2"/>
  </g>
</svg>