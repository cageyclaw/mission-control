<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0f"/>
  
  <!-- Grid lines -->
  <g opacity="0.08">
    <line x1="0" y1="240" x2="1920" y2="240" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="460" x2="1920" y2="460" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="680" x2="1920" y2="680" stroke="#00aaff" stroke-width="1"/>
    <line x1="0" y1="900" x2="1920" y2="900" stroke="#00aaff" stroke-width="1"/>
    <line x1="480" y1="120" x2="480" y2="1080" stroke="#cc88ff" stroke-width="1"/>
    <line x1="960" y1="120" x2="960" y2="1080" stroke="#cc88ff" stroke-width="1"/>
    <line x1="1440" y1="120" x2="1440" y2="1080" stroke="#cc88ff" stroke-width="1"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="140" height="70" rx="35" ry="35" fill="#cc88ff"/>
    <text x="70" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0a0a0f" text-anchor="middle">47-03</text>
    
    <rect x="160" y="5" width="1200" height="35" rx="17" ry="17" fill="#ff9900"/>
    <text x="180" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0a0a0f">SESSION MANAGEMENT</text>
    
    <rect x="160" y="45" width="1000" height="25" rx="12" ry="12" fill="#00aaff"/>
    <text x="180" y="63" font-family="Arial, sans-serif" font-size="14" fill="#0a0a0f">Lifecycle, Crew Assignment &amp; Status Inference</text>
    
    <rect x="1380" y="5" width="80" height="65" rx="10" ry="10" fill="#ff9900"/>
    <rect x="1470" y="5" width="60" height="65" rx="10" ry="10" fill="#00aaff"/>
    <rect x="1540" y="5" width="60" height="65" rx="10" ry="10" fill="#cc88ff"/>
    <rect x="1610" y="5" width="40" height="65" rx="8" ry="8" fill="#ff4444"/>
    <rect x="1660" y="5" width="180" height="65" rx="10" ry="10" fill="#0a0a0f" stroke="#ffcc00" stroke-width="2"/>
  </g>

  <!-- SESSION LIFECYCLE -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="400" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#00aaff" stroke-width="4" filter="url(#shadow)"/>
    
    <rect x="20" y="20" width="200" height="32" rx="16" ry="16" fill="#00aaff"/>
    <text x="120" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">SESSION LIFECYCLE</text>
    
    <!-- sessions.list() -->
    <rect x="30" y="70" width="340" height="60" rx="10" ry="10" fill="#1a1a2a" stroke="#00aaff" stroke-width="2"/>
    <text x="200" y="105" font-family="monospace" font-size="14" fill="#00aaff" text-anchor="middle">sessions.list() RPC</text>
    
    <!-- Arrow -->
    <polygon points="200,140 190,160 210,160" fill="#00aaff"/>
    
    <!-- Payload extraction -->
    <rect x="30" y="170" width="340" height="100" rx="10" ry="10" fill="#1a1a2a" stroke="#ff9900" stroke-width="2"/>
    <text x="200" y="200" font-family="monospace" font-size="13" fill="#ff9900" text-anchor="middle" font-weight="bold">EXTRACT PAYLOAD</text>
    <text x="50" y="230" font-family="monospace" font-size="11" fill="#888899">• recent.sessions[]</text>
    <text x="50" y="255" font-family="monospace" font-size="11" fill="#888899">• direct array</text>
    
    <!-- Arrow -->
    <polygon points="200,280 190,300 210,300" fill="#ff9900"/>
    
    <!-- Normalize -->
    <rect x="30" y="310" width="340" height="120" rx="10" ry="10" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    <text x="200" y="340" font-family="monospace" font-size="13" fill="#cc88ff" text-anchor="middle" font-weight="bold">NORMALIZE SESSION</text>
    <text x="50" y="370" font-family="monospace" font-size="11" fill="#888899">• Extract key / sessionId</text>
    <text x="50" y="395" font-family="monospace" font-size="11" fill="#888899">• Compute token usage</text>
    <text x="50" y="420" font-family="monospace" font-size="11" fill="#888899">• Calculate percentUsed</text>
    
    <!-- Arrow -->
    <polygon points="200,440 190,460 210,460" fill="#cc88ff"/>
    
    <!-- Store -->
    <rect x="30" y="470" width="340" height="80" rx="10" ry="10" fill="#1a1a2a" stroke="#00ff00" stroke-width="2"/>
    <text x="200" y="500" font-family="monospace" font-size="13" fill="#00ff00" text-anchor="middle" font-weight="bold">STORE</text>
    <text x="200" y="530" font-family="monospace" font-size="11" fill="#888899" text-anchor="middle">sessionsByKey.set(key, session)</text>
    
    <!-- Arrow -->
    <polygon points="200,560 190,580 210,580" fill="#00ff00"/>
    
    <!-- Real-time updates -->
    <rect x="30" y="590" width="340" height="100" rx="10" ry="10" fill="#1a1a2a" stroke="#ffcc00" stroke-width="2"/>
    <text x="200" y="620" font-family="monospace" font-size="13" fill="#ffcc00" text-anchor="middle" font-weight="bold">REAL-TIME UPDATES</text>
    <text x="50" y="650" font-family="monospace" font-size="11" fill="#888899">• sessions.changed event</text>
    <text x="50" y="675" font-family="monospace" font-size="11" fill="#888899">• Refresh triggers same flow</text>
  </g>

  <!-- CREW ASSIGNMENT -->
  <g transform="translate(470, 130)">
    <rect x="0" y="0" width="400" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#ff9900" stroke-width="4" filter="url(#shadow)"/>
    
    <rect x="20" y="20" width="200" height="32" rx="16" ry="16" fill="#ff9900"/>
    <text x="120" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">CREW ASSIGNMENT</text>
    
    <rect x="30" y="70" width="340" height="400" rx="12" ry="12" fill="#1a1a2a" stroke="#ff9900" stroke-width="2"/>
    <text x="200" y="100" font-family="monospace" font-size="14" fill="#ff9900" text-anchor="middle" font-weight="bold">mapSessionToCrewId()</text>
    
    <text x="50" y="140" font-family="monospace" font-size="12" fill="#ffffff">Priority Order:</text>
    
    <rect x="50" y="160" width="300" height="45" rx="8" fill="#0a0a0f" stroke="#00aaff" stroke-width="1"/>
    <text x="70" y="175" font-family="monospace" font-size="11" fill="#00aaff">1. Main agent patterns</text>
    <text x="70" y="195" font-family="monospace" font-size="10" fill="#888899">   agentId='main', key patterns</text>
    
    <rect x="50" y="215" width="300" height="45" rx="8" fill="#0a0a0f" stroke="#cc88ff" stroke-width="1"/>
    <text x="70" y="230" font-family="monospace" font-size="11" fill="#cc88ff">2. Known crew agentId</text>
    <text x="70" y="250" font-family="monospace" font-size="10" fill="#888899">   Match against CREW_MEMBERS</text>
    
    <rect x="50" y="270" width="300" height="45" rx="8" fill="#0a0a0f" stroke="#ffcc00" stroke-width="1"/>
    <text x="70" y="285" font-family="monospace" font-size="11" fill="#ffcc00">3. Subagent registry</text>
    <text x="70" y="305" font-family="monospace" font-size="10" fill="#888899">   getSubagentMapping(sessionId)</text>
    
    <rect x="50" y="325" width="300" height="45" rx="8" fill="#0a0a0f" stroke="#ff4444" stroke-width="1"/>
    <text x="70" y="340" font-family="monospace" font-size="11" fill="#ff4444">4. Fallback heuristics</text>
    <text x="70" y="360" font-family="monospace" font-size="10" fill="#888899">   Pattern matching on key</text>
    
    <!-- Session Selection -->
    <rect x="30" y="500" width="340" height="200" rx="12" ry="12" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    
    <text x="200" y="530" font-family="monospace" font-size="14" fill="#cc88ff" text-anchor="middle" font-weight="bold">SESSION SELECTION</text>
    
    <text x="50" y="570" font-family="monospace" font-size="12" fill="#ffffff">selectSession(sessionKey)</text>
    
    <text x="50" y="600" font-family="monospace" font-size="11" fill="#888899">1. Validate session exists</text>
    
    <text x="50" y="625" font-family="monospace" font-size="11" fill="#888899">2. Update selectedSessionKey</text>
    
    <text x="50" y="650" font-family="monospace" font-size="11" fill="#888899">3. Notify chat store</text>
    
    <text x="50" y="675" font-family="monospace" font-size="11" fill="#888899">4. Load history for session</text>
    
    <!-- Connection arrow to right panel -->
    <line x1="400" y1="600" x2="450" y2="600" stroke="#cc88ff" stroke-width="3"/>
    <polygon points="450,590 470,600 450,610" fill="#cc88ff"/>
  </g>

  <!-- STATUS INFERENCE -->
  <g transform="translate(900, 130)">
    <rect x="0" y="0" width="400" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#cc88ff" stroke-width="4" filter="url(#shadow)"/>
    
    <rect x="20" y="20" width="200" height="32" rx="16" ry="16" fill="#cc88ff"/>
    <text x="120" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">STATUS INFERENCE</text>
    
    <rect x="30" y="70" width="340" height="450" rx="12" ry="12" fill="#1a1a2a" stroke="#cc88ff" stroke-width="2"/>
    
    <text x="200" y="100" font-family="monospace" font-size="14" fill="#cc88ff" text-anchor="middle" font-weight="bold">inferStatus(session)</text>
    
    <!-- Error state -->
    <rect x="50" y="140" width="300" height="60" rx="8" fill="#0a0a0f" stroke="#ff4444" stroke-width="2"/>
    <circle cx="80" cy="170" r="12" fill="#ff4444"/>
    <text x="100" y="175" font-family="monospace" font-size="13" fill="#ff4444">'error'</text>
    <text x="160" y="175" font-family="monospace" font-size="11" fill="#888899">error/failed states</text>
    
    <!-- Active state -->
    <rect x="50" y="220" width="300" height="60" rx="8" fill="#0a0a0f" stroke="#00ff00" stroke-width="2"/>
    <circle cx="80" cy="250" r="12" fill="#00ff00"/>
    <text x="100" y="255" font-family="monospace" font-size="13" fill="#00ff00">'active'</text>
    <text x="160" y="255" font-family="monospace" font-size="11" fill="#888899">running/streaming</text>
    
    <!-- Idle state -->
    <rect x="50" y="300" width="300" height="60" rx="8" fill="#0a0a0f" stroke="#ffcc00" stroke-width="2"/>
    <circle cx="80" cy="330" r="12" fill="#ffcc00"/>
    <text x="100" y="335" font-family="monospace" font-size="13" fill="#ffcc00">'idle'</text>
    <text x="160" y="335" font-family="monospace" font-size="11" fill="#888899">2-10 min inactive</text>
    
    <!-- Offline state -->
    <rect x="50" y="380" width="300" height="60" rx="8" fill="#0a0a0f" stroke="#888899" stroke-width="2"/>
    <circle cx="80" cy="410" r="12" fill="#888899"/>
    <text x="100" y="415" font-family="monospace" font-size="13" fill="#888899">'offline'</text>
    <text x="170" y="415" font-family="monospace" font-size="11" fill="#888899">10+ min inactive</text>
    
    <!-- Age calculation -->
    <rect x="30" y="550" width="340" height="120" rx="12" ry="12" fill="#1a1a2a" stroke="#00aaff" stroke-width="2"/>
    
    <text x="200" y="580" font-family="monospace" font-size="13" fill="#00aaff" text-anchor="middle" font-weight="bold">AGE CALCULATION</text>
    
    <text x="50" y="610" font-family="monospace" font-size="11" fill="#ffffff">age = now - updatedAt</text>
    
    <text x="50" y="635" font-family="monospace" font-size="11" fill="#888899">&lt; 2 min → active</text>
    
    <text x="50" y="655" font-family="monospace" font-size="11" fill="#888899">2-10 min → idle</text>
  </g>

  <!-- CREW DISPLAY -->
  <g transform="translate(1340, 130)">
    <rect x="0" y="0" width="520" height="920" rx="20" ry="20" fill="#0a0a0f" stroke="#00aaff" stroke-width="4" filter="url(#shadow)"/>
    
    <rect x="20" y="20" width="180" height="32" rx="16" ry="16" fill="#00aaff"/>
    <text x="110" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0a0a0f" text-anchor="middle">CREW DISPLAY</text>
    
    <rect x="30" y="70" width="460" height="200" rx="12" ry="12" fill="#1a1a2a" stroke="#00aaff" stroke-width="2"/>
    
    <text x="260" y="100" font-family="monospace" font-size="14" fill="#00aaff" text-anchor="middle" font-weight="bold">Crew View Components</text>
    
    <rect x="50" y="120" width="180" height="50" rx="8" fill="#0a0a0f" stroke="#ff9900" stroke-width="1"/>
    <text x="140" y="150" font-family="monospace" font-size="12" fill="#ff9900" text-anchor="middle">CrewCard</text>
    
    <rect x="260" y="120" width="180" height="50" rx="8" fill="#0a0a0f" stroke="#00aaff" stroke-width="1"/>
    <text x="350" y="150" font-family="monospace" font-size="12" fill="#00aaff" text-anchor="middle">ContextBar</text>
    
    <rect x="50" y="190" width="390" height="60" rx="8" fill="#0a0a0f" stroke="#cc88ff" stroke-width="1"/>
    <text x="245" y="215" font-family="monospace" font-size="12" fill="#cc88ff" text-anchor="middle">CrewView</text>
    <text x="245" y="235" font-family="monospace" font-size="10" fill="#888899" text-anchor="middle">Sort by context %, offline at bottom</text>
    
    <!-- Context colors -->
    <rect x="30" y="300" width="460" height="200" rx="12" ry="12" fill="#1a1a2a" stroke="#ffcc00" stroke-width="2"/>
    
    <text x="260" y="330" font-family="monospace" font-size="14" fill="#ffcc00" text-anchor="middle" font-weight="bold">Context Risk Colors</text>
    
    <rect x="50" y="360" width="100" height="40" rx="6" fill="#00ff00"/>
    <text x="100" y="385" font-family="monospace" font-size="12" fill="#0a0a0f" text-anchor="middle">&lt;70%</text>
    
    <rect x="170" y="360" width="100" height="40" rx="6" fill="#ffcc00"/>
    <text x="220" y="385" font-family="monospace" font-size="12" fill="#0a0a0f" text-anchor="middle">70-85%</text>
    
    <rect x="290" y="360" width="100" height="40" rx="6" fill="#ff4444"/>
    <text x="340" y="385" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">&gt;85%</text>
    
    <text x="50" y="430" font-family="monospace" font-size="11" fill="#888899">47-01 Q  |  47-02 Data  |  47-03 Geordi</text>
    
    <text x="50" y="455" font-family="monospace" font-size="11" fill="#888899">47-04 Spark | 47-05 Riker | 47-06 Troi</text>
    
    <text x="50" y="480" font-family="monospace" font-size="11" fill="#888899">47-07 Barclay</text>
    
    <!-- LCARS deco -->
    <rect x="30" y="820" width="100" height="60" rx="8" fill="#ff9900"/>
    <rect x="140" y="820" width="80" height="60" rx="8" fill="#00aaff"/>
    <rect x="230" y="820" width="80" height="60" rx="8" fill="#cc88ff"/>
    <rect x="320" y="820" width="60" height="60" rx="8" fill="#ff4444"/>
    <rect x="390" y="820" width="100" height="60" rx="8" fill="#0a0a0f" stroke="#ffcc00" stroke-width="2"/>
  </g>
</svg>